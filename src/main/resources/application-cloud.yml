server:
  port: 80
  address: 0.0.0.0  # 重要：监听所有网络接口
  servlet:
    context-path: /  # 改为根路径，避免路径问题

spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate  # 改为validate，更安全

# 激活健康检查端点
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.goldenegg: INFO
    org.springframework.web: WARN